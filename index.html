<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glyph Outline</title>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Single dark look: black ground, mid-grey outline, red dot, round +/- controls below */
:root { --bg:#000; --line:#808080; --ctl:#1a1a1a; --ctl-hi:#2a2a2a; --text:#b5b5b5; color-scheme:dark }
html,body { height:100%; background:var(--bg); color:var(--text) }
body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px; box-sizing:border-box; font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  user-select:none; -webkit-user-select:none }
#wrap { width:min(100%,900px); max-width:100%; aspect-ratio:820/640; max-height:calc(100% - 200px); position:relative }
canvas { width:100%; height:100%; display:block; touch-action:none; cursor:pointer }
.controls { display:flex; align-items:center; gap:18px }
.pips { display:inline-flex; gap:5px; align-items:center; height:26px }
.pips i { width:8px; height:18px; border-radius:2px; background:#333; transition:background .2s }
.pips i.on { background:#e33 }
button { width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line); background:var(--ctl);
  color:#ddd; font-size:30px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation }
button:hover { background:var(--ctl-hi) }
button:active { transform:scale(.94) }
button:focus-visible { outline:2px solid #e33; outline-offset:3px }
button:disabled { opacity:.35; cursor:default }
.bar { display:flex; flex-wrap:wrap; justify-content:center; gap:14px 44px; transition:opacity .5s }
.bar.wait { opacity:.25; pointer-events:none }
.readout { min-width:5.5ch; text-align:center; font-variant-numeric:tabular-nums; font-size:15px }
.readout b { display:block; font-size:22px; color:#eee; font-weight:600 }
#top { display:flex; gap:14px; justify-content:center; transition:opacity .5s }
#top.wait { opacity:.25; pointer-events:none }
#top button { width:48px; height:48px }
#top svg { width:22px; height:22px; fill:none; stroke:#ddd; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
#top svg .solid { fill:#ddd; stroke:none }
#pop { position:fixed; inset:0; display:grid; place-items:center; background:rgb(0 0 0 / .55); z-index:10;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); animation:fade .2s ease-out }
#pop .card { background:#141414; border:1.5px solid var(--line); border-radius:18px; padding:26px 26px 20px; max-width:320px; width:100%;
  text-align:center; display:grid; gap:14px; justify-items:center; animation:rise .32s cubic-bezier(.2,1.4,.4,1) }
#pop .smile { width:64px; height:64px }
#pop p { margin:0; color:#ddd; font-size:17px; line-height:1.45; text-wrap:balance }
#pop p.stat { font-size:14px; color:#9a9a9a; padding-top:12px; border-top:1px solid #2a2a2a }
#pop p strong { color:#ff4a4a; font-variant-numeric:tabular-nums; white-space:nowrap }
#pop .ok { width:auto; height:auto; border-radius:999px; font-size:15px; padding:9px 22px; color:#ddd }
@keyframes fade { from { opacity:0 } }
@keyframes rise { from { transform:scale(.8); opacity:0 } }
@media (prefers-reduced-motion: reduce){ #pop, #pop .card { animation:none } }
#hint { font-size:13px; color:#777; min-height:1.4em; text-align:center }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>

<div id="top" class="wait">

  if(it < TRACE){
    const tip = tracePartial(easeInOut(it/TRACE));
    ctx.fillStyle='#d0d0d0'; ctx.beginPath(); ctx.arc(tip[0],tip[1],3.2/scale*dpr,0,Math.PI*2); ctx.fill();   // pen tip
    requestAnimationFrame(frame); return;
  }
  ctx.stroke(shape);
  const pp = POP ? Math.min(1,(it-TRACE)/POP) : 1;
  if(pp>=1 && !ready){ ready=true; document.querySelector('.bar').classList.remove('wait'); document.getElementById('top').classList.remove('wait');
    document.getElementById('hint').textContent='Tap inside the shape to start'; }
  if(pp<1){   // pop: overshooting scale plus an expanding ring
    const d=dots[0], rr=R*Math.max(0,easeOutBack(pp));
    ctx.globalAlpha=1-pp; ctx.strokeStyle=d.color; ctx.lineWidth=2/scale*dpr;
    ctx.beginPath(); ctx.arc(d.x,d.y,R+pp*34,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=d.color; ctx.beginPath(); ctx.arc(d.x,d.y,rr,0,Math.PI*2); ctx.fill();
    requestAnimationFrame(frame); return;
  }
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(layer,0,0); ctx.setTransform(scale,0,0,scale,ox,oy);
  for(const d of dots){ ctx.fillStyle=d.color; ctx.beginPath(); ctx.arc(d.x,d.y,R,0,Math.PI*2); ctx.fill(); }
  requestAnimationFrame(frame);
}
ui(); requestAnimationFrame(frame);
</script>
