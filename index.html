<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glyph Outline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Single dark look: black ground, mid-grey wireframe letters in a perspective world, red dot, round controls */
:root { --bg:#000; --line:#808080; --ctl:#1a1a1a; --ctl-hi:#2a2a2a; --text:#b5b5b5; --accent:#e33; color-scheme:dark }
html,body { height:100%; background:var(--bg); color:var(--text) }
body { display:flex; flex-direction:column; align-items:center; gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px; box-sizing:border-box; font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  user-select:none; -webkit-user-select:none; overflow:hidden }
#head { width:min(100%,960px); display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0 }
/* letter list: 13 per row = 2 rows on wide screens; narrower screens wrap into more rows */
#letters { --b:46px; --bw:58px; --g:6px; display:flex; flex-wrap:wrap; justify-content:center; gap:var(--g);
  width:100%; max-width:calc(12*var(--bw) + 11*var(--g)); padding:2px 0; box-sizing:border-box }
#letters button { flex:0 0 auto; width:var(--bw,var(--b)); height:var(--b); border-radius:12px; border:1.5px solid #2c2c2c; background:transparent }
#letters button svg { width:90%; height:84%; fill:#6f6f6f; transition:fill .15s }
#letters button:hover svg { fill:#aaa }
#letters button[aria-pressed="true"] { border-color:var(--accent); background:#1a0d0d }
#letters button[aria-pressed="true"] svg { fill:#eee }
#wrap { flex:1 1 auto; min-height:220px; width:min(100%,960px); max-width:100%; position:relative }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab }
canvas.drag { cursor:grabbing }
.controls { display:flex; align-items:center; gap:18px }
.pips { display:inline-flex; gap:5px; align-items:center; height:26px }
.pips i { width:8px; height:18px; border-radius:2px; background:#333; transition:background .2s }
.pips i.on { background:var(--accent) }
button { width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line); background:var(--ctl);
  color:#ddd; font-size:30px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation }
button:hover { background:var(--ctl-hi) }
button:active { transform:scale(.94) }
button:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
button:disabled { opacity:.35; cursor:default }
.bar { display:flex; flex-wrap:wrap; justify-content:center; gap:10px 44px; transition:opacity .5s }
.bar.wait { opacity:.25; pointer-events:none }
.readout { min-width:5.5ch; text-align:center; font-variant-numeric:tabular-nums; font-size:15px }
.readout b { display:block; font-size:22px; color:#eee; font-weight:600 }
#top { display:flex; gap:14px; justify-content:center; transition:opacity .5s }
#top.wait { opacity:.25; pointer-events:none }
#top button { width:48px; height:48px }
#top svg { width:22px; height:22px; fill:none; stroke:#ddd; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
#top svg .solid { fill:#ddd; stroke:none }
#pop { position:fixed; inset:0; display:grid; place-items:center; background:rgb(0 0 0 / .55); z-index:10;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); animation:fade .2s ease-out }
#pop .card { background:#141414; border:1.5px solid var(--line); border-radius:18px; padding:26px 26px 20px; max-width:320px; width:100%;
  text-align:center; display:grid; gap:14px; justify-items:center; animation:rise .32s cubic-bezier(.2,1.4,.4,1); box-sizing:border-box }
#pop .smile { width:64px; height:64px }
#pop p { margin:0; color:#ddd; font-size:17px; line-height:1.45; text-wrap:balance }
#pop p.stat { font-size:14px; color:#9a9a9a; padding-top:12px; border-top:1px solid #2a2a2a }
#pop p strong { color:#ff4a4a; font-variant-numeric:tabular-nums; white-space:nowrap }
#pop .ok { width:auto; height:auto; border-radius:999px; font-size:15px; padding:9px 22px; color:#ddd }
@keyframes fade { from { opacity:0 } }
@keyframes rise { from { transform:scale(.8); opacity:0 } }
@media (prefers-reduced-motion: reduce){ #pop, #pop .card { animation:none } }
[hidden] { display:none !important }
#hint { font-size:13px; color:#777; min-height:1.4em; text-align:center }
@media (max-width:520px){ #letters { --b:40px; --bw:40px; --g:5px } .bar { gap:10px 20px } .controls { gap:10px }
  button { width:44px; height:44px; font-size:26px } #top button { width:42px; height:42px } .readout b { font-size:19px } }
@media (max-width:380px){ #letters { --b:37px; --bw:37px; --g:4px } .bar { gap:8px 14px } .controls { gap:8px }
  button { width:40px; height:40px; font-size:24px } .readout { min-width:4.5ch } }
@media (max-height:700px) and (min-width:521px){ button { width:48px; height:48px; font-size:26px } #top button { width:42px; height:42px } .readout b { font-size:19px } }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>

<div id="head">
  <div id="letters" dir="rtl" role="group" aria-label="Choose a letter"></div>
  <div id="top" class="wait">
    <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path class="solid" d="M8 5.5v13l11-6.5z"/></svg></button>
    <button id="reset" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>

</div>
<div id="wrap"><canvas id="c" aria-label="3D letter with bouncing dots. Tap inside the letter to start, drag to look around."></canvas></div>
<div class="bar wait">
  <div class="controls" role="group" aria-label="Dots">

    <div class="readout" id="count"><b>1</b>dot</div>
    <button id="plus" aria-label="Split a dot">+</button>
  </div>
  <div class="controls" role="group" aria-label="Speed">
    <button id="slower" aria-label="Slower">&minus;</button>
    <div class="readout" id="speed"><b><span class="pips"></span></b>speed</div>
    <button id="faster" aria-label="Faster">+</button>
  </div>
</div>
<div id="hint">&nbsp;</div>
<div id="pop" hidden role="dialog" aria-modal="true" aria-labelledby="popmsg">
  <div class="card">
    <svg class="smile" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#ffcc33"/>
      <circle cx="22" cy="25" r="4.2" fill="#3a2a00"/><circle cx="42" cy="25" r="4.2" fill="#3a2a00"/>
      <path d="M17 37q15 15 30 0" fill="none" stroke="#3a2a00" stroke-width="4.2" stroke-linecap="round"/></svg>
    <p id="popmsg"></p>
    <p id="popstat" class="stat"></p>
    <button class="ok" id="popok">Fine, carry on</button>
  </div>
</div>

// ---------- camera: orbit around the letter ----------
const cv = $('c'), ctx = cv.getContext('2d');
const staticLayer = document.createElement('canvas'), sctx = staticLayer.getContext('2d');
const trailLayer = document.createElement('canvas'), tctx = trailLayer.getContext('2d');
const HOME = { yaw:-0.5, pitch:0.32, zoom:1 };
const cam = { ...HOME, W:1, H:1, f:1, dist:1, ver:0 };
let dpr = 1;
const FOV = 38*Math.PI/180, FLOOR = -330;
function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  const r = cv.getBoundingClientRect(); const W=Math.round(r.width*dpr), H=Math.round(r.height*dpr); if(W<2||H<2) return;

}
function touchCam(){ const m=Math.min(cam.W,cam.H); cam.f = m/2/Math.tan(FOV/2); cam.dist = 470/Math.sin(FOV/2)*cam.zoom; cam.ver++; }
new ResizeObserver(resize).observe(cv);
function proj(x,y,z, out){

}
function screenRay(sx, sy){   // inverse of proj: returns camera origin and direction in letter space
  const cy=Math.cos(cam.yaw), sy_=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const inv = (X,Y,Z) => { const y=cp*Y+sp*Z, z1=-sp*Y+cp*Z; return [cy*X - sy_*z1, y, sy_*X + cy*z1 + DEPTH/2]; };
  const o = inv(0,0,cam.dist), p = inv((sx-cam.W/2)/cam.f, -(sy-cam.H/2)/cam.f, cam.dist-1);
  return [o, [p[0]-o[0], p[1]-o[1], p[2]-o[2]]];
}
const P = [0,0,0], Q = [0,0,0];

// ---------- static scene: floor grid + extruded letter wireframe ----------
let staticKey = '';
function drawStatic(trace, solid){
  const key = cam.ver+'|'+trace.toFixed(3)+'|'+solid.toFixed(3);
  if(key === staticKey) return; staticKey = key;
  const c = sctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cam.W,cam.H); c.lineCap='round'; c.lineJoin='round';
  // floor grid fading with distance from the letter
  c.lineWidth = 1*dpr;
  for(let a=-1200; a<=1200; a+=100) for(const along of [0,1]) for(let b=-1200; b<1200; b+=100){
    const x0=along?a:b, z0=along?b:a, x1=along?a:b+100, z1=along?b+100:a;
    const fade = 1 - Math.min(1, Math.hypot((x0+x1)/2, (z0+z1)/2)/1200); if(fade<=0) continue;
    proj(x0, FLOOR, z0+DEPTH/2, P); proj(x1, FLOOR, z1+DEPTH/2, Q); if(P[2]<40||Q[2]<40) continue;
    c.strokeStyle = `rgba(128,128,128,${(0.22*fade*fade).toFixed(3)})`; c.beginPath(); c.moveTo(P[0],P[1]); c.lineTo(Q[0],Q[1]); c.stroke();
  }
  // soft shadow of the letter on the floor
  c.fillStyle = 'rgba(128,128,128,0.06)'; c.beginPath();
  for(const ct of G.contours){ ct.forEach((p,k)=>{ proj(p[0]+p[1]*0.15, FLOOR, DEPTH/2 - p[1]*0.45, P); k?c.lineTo(P[0],P[1]):c.moveTo(P[0],P[1]); }); c.closePath(); }
  c.fill('evenodd');
  if(solid > 0){
    // back face and depth rungs
    c.globalAlpha = solid; c.strokeStyle = 'rgba(128,128,128,0.45)'; c.lineWidth = 1.3*dpr; c.beginPath();
    for(const ct of G.contours){ ct.forEach((p,k)=>{ proj(p[0],p[1],0,P); k?c.lineTo(P[0],P[1]):c.moveTo(P[0],P[1]); }); c.closePath(); }
    c.stroke();
    c.strokeStyle = 'rgba(128,128,128,0.28)'; c.beginPath();
    for(const p of G.rungs){ proj(p[0],p[1],0,P); proj(p[0],p[1],DEPTH,Q); c.moveTo(P[0],P[1]); c.lineTo(Q[0],Q[1]); }
    c.stroke();

    for(const ct of G.contours){ ct.forEach((p,k)=>{ proj(p[0],p[1],DEPTH,P); k?c.lineTo(P[0],P[1]):c.moveTo(P[0],P[1]); }); c.closePath(); }

      const a=ct[k-1], u=(left-cum[k-1])/(cum[k]-cum[k-1]); proj(a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, DEPTH, P); c.lineTo(P[0],P[1]); tip=[P[0],P[1]]; break; }

}

// ---------- dots ----------
const usedHues = [0];
function newHue(){ let h, tries=0;
  do { h=Math.random()*360; tries++; } while(tries<40 && usedHues.some(u=>Math.min(Math.abs(u-h),360-Math.abs(u-h)) < 360/(usedHues.length+3)));
  usedHues.push(h); return h; }
function makeDot(x,y,z,h,red){ return { x,y,z, vx:0,vy:0,vz:0, h, color: red ? '#ff2a2a' : `hsl(${h.toFixed(0)} 90% 60%)`, pts:[x,y,z], tail:[x,y,z] }; }
let dots = [], oldTrails = [];
let running=false, paused=false, elapsed=0, drawnLen=0, current=0;

function rodrigues(v, k, a){   // rotate vector v about unit axis k by angle a
  const c=Math.cos(a), s=Math.sin(a), d=k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
  return [ v[0]*c + (k[1]*v[2]-k[2]*v[1])*s + k[0]*d*(1-c),
           v[1]*c + (k[2]*v[0]-k[0]*v[2])*s + k[1]*d*(1-c),
           v[2]*c + (k[0]*v[1]-k[1]*v[0])*s + k[2]*d*(1-c) ]; }
function randomDir(){ const t=Math.random()*Math.PI*2, z=(Math.random()-.5)*0.6, r=Math.sqrt(1-z*z); return [Math.cos(t)*r, Math.sin(t)*r, z]; }
function split(){
  if(dots.length>=MAX) return;
  const p = dots[Math.floor(Math.random()*dots.length)];
  let v=[p.vx,p.vy,p.vz]; const moving = running && (v[0]||v[1]||v[2]);
  if(!moving) v = randomDir().map(c=>c*SPEED);
  const r = randomDir(); let k=[v[1]*r[2]-v[2]*r[1], v[2]*r[0]-v[0]*r[2], v[0]*r[1]-v[1]*r[0]]; const kl=Math.hypot(...k)||1; k=k.map(c=>c/kl);
  const a = (20+Math.random()*25)*Math.PI/180, va=rodrigues(v,k,a), vb=rodrigues(v,k,-a);
  const d = makeDot(p.x,p.y,p.z,newHue(),false);
  if(running){ [p.vx,p.vy,p.vz]=va; [d.vx,d.vy,d.vz]=vb; p.pts.push(p.x,p.y,p.z); }
  dots.push(d); ui();
}
function merge(){ if(dots.length<=1) return; const d=dots.pop(); d.pts.push(d.x,d.y,d.z); oldTrails.push(d); usedHues.length=Math.max(1,usedHues.length-1); ui(); }

// physics: elastic reflection off the letter's side walls (xy outline) and its front/back faces (z)
function step(d, dt){
  const px=d.x, py=d.y; let hit=false;
  d.x += d.vx*dt; d.y += d.vy*dt; d.z += d.vz*dt;
  if(d.z < R){ d.z = 2*R - d.z; d.vz = Math.abs(d.vz); hit=true; }
  else if(d.z > DEPTH-R){ d.z = 2*(DEPTH-R) - d.z; d.vz = -Math.abs(d.vz); hit=true; }
  const [cx,cy,dist] = closest(d.x,d.y), isIn = inside(d.x,d.y);

    let nx=d.x-cx, ny=d.y-cy, L=Math.hypot(nx,ny)||1; nx/=L; ny/=L; if(!isIn){ nx=-nx; ny=-ny; }
    const vn = d.vx*nx + d.vy*ny; if(vn < 0){ d.vx -= 2*vn*nx; d.vy -= 2*vn*ny; hit=true; }   // v' = v − 2(v·n)n
    d.x = cx + nx*(R+0.01); d.y = cy + ny*(R+0.01); if(!inside(d.x,d.y)){ d.x=px; d.y=py; }
  }

// ---------- trails: incremental while the camera is still, full redraw when it moves ----------
let trailVer = -1;
function strokeTrail(c, d, live){
  const p=d.pts; if(p.length<3) return; c.strokeStyle=d.color; c.beginPath();
  proj(p[0],p[1],p[2],P); c.moveTo(P[0],P[1]);
  for(let i=3;i<p.length;i+=3){ proj(p[i],p[i+1],p[i+2],P); c.lineTo(P[0],P[1]); }
  if(live){ proj(d.x,d.y,d.z,P); c.lineTo(P[0],P[1]); } c.stroke(); }

  const c=tctx; c.setTransform(1,0,0,1,0,0); c.lineCap='round'; c.lineJoin='round'; c.lineWidth=1.6*dpr;
  if(trailVer !== cam.ver){ trailVer = cam.ver; c.clearRect(0,0,cam.W,cam.H);
    for(const d of oldTrails) strokeTrail(c,d,false); for(const d of dots) strokeTrail(c,d,true); return; }
  for(const [d, from, list] of newPts){ c.strokeStyle=d.color; c.beginPath(); proj(from[0],from[1],from[2],P); c.moveTo(P[0],P[1]);
    for(let i=0;i<list.length;i+=3){ proj(list[i],list[i+1],list[i+2],P); c.lineTo(P[0],P[1]); } c.stroke(); }
}

// ---------- intro + lifecycle ----------
let introStart=null, ready=false;
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c=2.2; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
function selectLetter(i, resetSpeed){
  current = i; loadGeometry(i);
  dots = [makeDot(G.start[0], G.start[1], DEPTH/2, 0, true)]; oldTrails = []; usedHues.length = 1;
  running=false; paused=false; elapsed=0; drawnLen=0;
  if(resetSpeed){ level=1; SPEED=SPEEDS[level]; }
  Object.assign(cam, HOME); touchCam(); staticKey=''; trailVer=-1;
  afterPop=null; pop.hidden=true; ready=false; introStart=null;
  document.querySelector('.bar').classList.add('wait'); $('top').classList.add('wait');
  $('hint').innerHTML='&nbsp;';
  document.querySelectorAll('#letters button').forEach((b,k)=>b.setAttribute('aria-pressed', k===i ? 'true' : 'false'));
  try { localStorage.setItem('glyph-letter2', String(i)); } catch(e){}
  playIcon(); ui();
}
function launch(tx,ty){
  running=true; paused=false; $('hint').textContent='Drag to look around · pinch or scroll to zoom'; playIcon();
  dots.forEach((d,i)=>{ let dx=tx-d.x, dy=ty-d.y; const L=Math.hypot(dx,dy);
    let v = L<1 ? randomDir() : [dx/L, dy/L, (Math.random()-.5)*0.7];
    const n=Math.hypot(...v); v=v.map(c=>c/n*SPEED);
    const spread = dots.length>1 ? (i/(dots.length-1)-.5)*1.2 : 0;
    if(spread) v = rodrigues(v,[0,0,1],spread);
    [d.vx,d.vy,d.vz]=v; });
}

// ---------- controls ----------
function setSpeed(l){ l=Math.max(0,Math.min(SPEEDS.length-1,l)); if(l===level) return;
  const k=SPEEDS[l]/SPEED; level=l; SPEED=SPEEDS[l]; for(const d of dots){ d.vx*=k; d.vy*=k; d.vz*=k; } ui(); }
function ui(){
  const n=dots.length; $('count').innerHTML=`<b>${n}</b>${n===1?'dot':'dots'}`;
  $('plus').disabled = n>=MAX; $('minus').disabled = n<=1;
  document.querySelector('.pips').innerHTML = SPEEDS.map((_,i)=>`<i class="${i<=level?'on':''}"></i>`).join('');
  $('slower').disabled = level<=0; $('faster').disabled = level>=SPEEDS.length-1; }
$('plus').onclick=split; $('minus').onclick=merge;
$('slower').onclick=()=>setSpeed(level-1); $('faster').onclick=()=>setSpeed(level+1);

const playBtn=$('play'), pop=$('pop');
const ICON_PLAY='<path class="solid" d="M8 5.5v13l11-6.5z"/>', ICON_PAUSE='<rect class="solid" x="6.5" y="5.5" width="4" height="13" rx="1"/><rect class="solid" x="13.5" y="5.5" width="4" height="13" rx="1"/>';
function playIcon(){ const on=running&&!paused; playBtn.querySelector('svg').innerHTML = on?ICON_PAUSE:ICON_PLAY; playBtn.setAttribute('aria-label', on?'Pause':'Play'); }
function fmt(sec){ sec=Math.max(1,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60, out=[];
  if(h) out.push(h+(h===1?' hour':' hours')); if(m) out.push(m+(m===1?' minute':' minutes')); if(s||!out.length) out.push(s+(s===1?' second':' seconds'));
  return out.length>1 ? out.slice(0,-1).join(', ')+' and '+out[out.length-1] : out[0]; }
const MM_PER_UNIT = 25.4/96, EARTH_KM = 40075;   // one unit = one CSS pixel; equatorial circumference
function fmtLen(mm){ if(mm<10) return mm.toFixed(1)+' mm'; if(mm<1000) return (mm/10).toFixed(1)+' cm'; if(mm<1e6) return (mm/1000).toFixed(2)+' m'; return (mm/1e6).toFixed(3)+' km'; }
function fmtSmall(x){ if(x>=1) return x.toFixed(2); if(x===0) return '0'; const d=Math.min(12,Math.max(2,1-Math.floor(Math.log10(x)))); return x.toFixed(d); }
function fmtYears(sec){ const y=sec/31557600; if(y>=1e6) return Math.round(y/1e6).toLocaleString()+' million years';
  if(y>=1) return Math.round(y).toLocaleString()+(Math.round(y)===1?' year':' years'); return fmt(sec); }
let afterPop=null;
function showStats(){
  const mm=drawnLen*MM_PER_UNIT, laps=mm/(EARTH_KM*1e6), lapSec = mm>0 ? elapsed/laps : 0;
  $('popmsg').innerHTML = `You have wasted <strong>${fmt(elapsed)}</strong> watching dots bounce.`;
  $('popstat').innerHTML = `Your dots drew <strong>${fmtLen(mm)}</strong> of line. That's <strong>${fmtSmall(laps)}</strong> times around the Earth.`
    + (mm>0 && laps<1 ? ` At this pace, one full lap would take about <strong>${fmtYears(lapSec)}</strong>.` : '');
  pop.hidden=false; $('popok').focus(); }
function closePop(){ if(pop.hidden) return; pop.hidden=true; if(afterPop){ const f=afterPop; afterPop=null; f(); } else playBtn.focus(); }
function setPaused(p){ paused=p; playIcon(); if(p){ $('popok').textContent='Fine, carry on'; showStats(); } else if(!pop.hidden){ afterPop=null; pop.hidden=true; } }
playBtn.onclick=()=>{ if(!ready) return;
  if(!running){ const a=Math.random()*Math.PI*2; launch(G.start[0]+Math.cos(a)*100, G.start[1]+Math.sin(a)*100); }
  else setPaused(!paused); };
$('popok').onclick=closePop;
pop.addEventListener('click', e=>{ if(e.target===pop) closePop(); });
addEventListener('keydown', e=>{ if(e.key==='Escape') closePop(); });
$('reset').onclick=()=>{
  if(elapsed>0){ paused=true; playIcon(); $('popok').textContent='Start over'; afterPop=()=>selectLetter(current,true); showStats(); }
  else selectLetter(current,true); };

// letter picker
const strip = $('letters');
LETTERS.forEach((L,i)=>{ const b=document.createElement('button');
  b.setAttribute('aria-label', L.name); b.title = L.name; b.dir='ltr';
  b.innerHTML = `<svg viewBox="-465 -319 930 639" aria-hidden="true"><path fill-rule="evenodd" d="${L.icon}"/></svg>`;
  b.onclick = ()=>{ if(i!==current) selectLetter(i,false); };
  strip.appendChild(b); });
// balance rows: as few rows as fit (2 on wide screens), with the letters spread evenly across them
function balanceRows(){
  const cs=getComputedStyle(strip), b=parseFloat(cs.getPropertyValue('--bw')), g=parseFloat(cs.getPropertyValue('--g'));
  const avail=strip.parentElement.clientWidth, n=LETTERS.length;
  const fit=Math.max(1, Math.min(13, Math.floor((avail+g)/(b+g)))), rows=Math.ceil(n/fit), per=Math.ceil(n/rows);
  strip.style.maxWidth = (per*b + (per-1)*g) + 'px'; }
new ResizeObserver(balanceRows).observe(strip.parentElement);

// ---------- pointer: tap to launch, drag to orbit, pinch / wheel to zoom ----------
const pts = new Map(); let gesture=null;
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1) gesture={ x:e.clientX, y:e.clientY, moved:false, yaw:cam.yaw, pitch:cam.pitch };
  else if(pts.size===2){ const [a,b]=[...pts.values()]; gesture={ pinch:Math.hypot(a.x-b.x,a.y-b.y), zoom:cam.zoom, moved:true }; } });
cv.addEventListener('pointermove', e=>{ if(!pts.has(e.pointerId)||!gesture) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gesture.pinch){ if(pts.size<2) return; const [a,b]=[...pts.values()]; cam.zoom=Math.min(2.4,Math.max(0.45, gesture.zoom*gesture.pinch/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)))); touchCam(); return; }
  const dx=e.clientX-gesture.x, dy=e.clientY-gesture.y;
  if(!gesture.moved && Math.hypot(dx,dy) > 6){ gesture.moved=true; cv.classList.add('drag'); }
  if(gesture.moved){ cam.yaw = gesture.yaw + dx*0.006; cam.pitch = Math.max(-1.25, Math.min(1.25, gesture.pitch + dy*0.006)); touchCam(); } });
function endPointer(e){ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); cv.classList.remove('drag');
  if(gesture && !gesture.moved && !gesture.pinch && pts.size===0 && e.type==='pointerup') tap(e);
  if(pts.size===0) gesture=null; }
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e=>{ e.preventDefault(); cam.zoom=Math.min(2.4,Math.max(0.45, cam.zoom*Math.exp(e.deltaY*0.0012))); touchCam(); }, {passive:false});
cv.addEventListener('dblclick', ()=>{ Object.assign(cam,{yaw:HOME.yaw,pitch:HOME.pitch,zoom:HOME.zoom}); touchCam(); });
function tap(e){
  if(!ready) return;
  const r=cv.getBoundingClientRect(), [o,d]=screenRay((e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr);
  // test the front face, the middle and the back face; the first one that lands inside the letter wins
  for(const zp of [DEPTH, DEPTH/2, 0]){ if(Math.abs(d[2])<1e-6) break; const t=(zp-o[2])/d[2]; if(t<=0) continue;
    const x=o[0]+d[0]*t, y=o[1]+d[1]*t;
    if(inside(x,y)){ if(!running) launch(x,y); else if(paused) setPaused(false); return; } }
}

// ---------- frame loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000, 1/30); last=now; const t=now/1000;
  if(introStart===null) introStart=t;
  const it=t-introStart;
  const trace = TRACE ? Math.min(1, easeInOut(Math.min(1,it/TRACE))) : 1;
  const solid = SOLID ? Math.max(0, Math.min(1,(it-TRACE)/SOLID)) : 1;
  const pp = POP ? Math.max(0, Math.min(1,(it-TRACE-SOLID)/POP)) : 1;
  if(pp>=1 && !ready){ ready=true; document.querySelector('.bar').classList.remove('wait'); $('top').classList.remove('wait');
    $('hint').textContent='Tap inside the letter to start · drag to look around'; }

  const fresh=[];
  if(running && !paused){
    elapsed += dt;
    const sub = Math.max(1, Math.ceil(SPEED*dt/(R*0.5)));
    for(const d of dots){ const before=d.pts.length, from=d.tail.slice();
      for(let s=0;s<sub;s++) step(d, dt/sub);
      const list=d.pts.slice(before); list.push(d.x,d.y,d.z); fresh.push([d,from,list]); d.tail=[d.x,d.y,d.z]; }
  }
  drawStatic(trace, solid);
  updateTrails(fresh);

  const c=ctx; c.setTransform(1,0,0,1,0,0); c.fillStyle='#000'; c.fillRect(0,0,cam.W,cam.H);
  c.drawImage(staticLayer,0,0); c.drawImage(trailLayer,0,0);
  if(pp>0){
    const order = dots.map(d=>{ proj(d.x,d.y,d.z,P); return [d,P[0],P[1],P[2]]; }).sort((a,b)=>b[3]-a[3]);
    for(const [d,sx,sy,z] of order){
      const scale = cam.f/z, rr = R*scale*(pp<1 ? Math.max(0,easeOutBack(pp)) : 1);
      if(pp<1){ c.globalAlpha=1-pp; c.strokeStyle=d.color; c.lineWidth=2*dpr; c.beginPath(); c.arc(sx,sy,(R+pp*34)*scale,0,Math.PI*2); c.stroke(); c.globalAlpha=1; }
      if(rr<=0) continue;
      const g=c.createRadialGradient(sx-rr*0.35, sy-rr*0.35, rr*0.1, sx, sy, rr);
      g.addColorStop(0,'#fff'); g.addColorStop(0.25,d.color); g.addColorStop(1, d.h===0&&d.color==='#ff2a2a' ? '#7a0000' : `hsl(${d.h.toFixed(0)} 80% 28%)`);
      c.fillStyle=g; c.beginPath(); c.arc(sx,sy,rr,0,Math.PI*2); c.fill();
    }
  }
  requestAnimationFrame(frame);
}
let first = 0; try { const s=parseInt(localStorage.getItem('glyph-letter2'),10); if(s>=0 && s<LETTERS.length) first=s; } catch(e){}
resize(); selectLetter(first, true); requestAnimationFrame(frame);
